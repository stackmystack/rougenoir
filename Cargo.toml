[package]
authors = ["Firas al-Khalil <firasalkhalil@gmail.com>"]
autobenches = false
description = "A red-black tree and set with callbacks"
edition = "2024"
license = "GPL-2.0-only"
name = "rougenoir"
version = "0.1.0"

[dependencies]
bumpalo = { version = "3", optional = true }
blink-alloc = { version = "0.3", optional = true }

[features]
default = []
# A local slab-of-chunks pool allocator (`rougenoir::alloc::Slab`). This is
# rougenoir's own implementation — it does *not* pull in the `slab` crate.
slab = []
# Adapter for `&bumpalo::Bump` as a node backing store.
bumpalo = ["dep:bumpalo"]
# Adapter for `&blink_alloc::BlinkAlloc` as a node backing store.
blink-alloc = ["dep:blink-alloc"]
# Bridge any `core::alloc::Allocator` in via `rougenoir::alloc::Std`. Needs a
# nightly toolchain (`cargo +nightly …`) because it enables `allocator_api`.
nightly = []

[dev-dependencies]
criterion = "0.6"
pretty_assertions = "1"
quickcheck = "1"
quickcheck_macros = "1"
rand = "0.9"
rand_chacha = "0.9"
rbtree = "0.2"

# Benchmarks are release-realistic: LTO + a single codegen unit so the
# monomorphised, inlined tree code the benches see matches what a `--release`
# downstream crate gets. Slower to build, steadier to measure.
[profile.bench]
codegen-units = 1
lto = "thin"

# The regression suite: rougenoir's own types across every insertion shape and
# size regime. This is what you run day to day and what `--save-baseline`
# tracks.
[[bench]]
name = "rougenoir"
harness = false

# rougenoir vs `std::collections::BTreeMap` vs the `rbtree` crate. A separate
# target because it answers a "once in a while" question and roughly triples
# measurement time.
[[bench]]
name = "compare"
harness = false

# rougenoir's tree across node backing stores (`Global`/`Slab`/`bumpalo`/
# `blink-alloc`). Needs the allocator features; run via `just bench-allocators`.
[[bench]]
name = "allocators"
harness = false
required-features = ["slab", "bumpalo", "blink-alloc"]
