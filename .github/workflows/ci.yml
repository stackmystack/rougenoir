name: CI
on:
  pull_request:
  push:
    branches:
      - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just,typos,cargo-nextest

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - run: just lint

      - run: just test-examples

  features:
    name: allocator features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal
      - run: rustup toolchain install nightly --profile minimal

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-features-${{ hashFiles('**/Cargo.lock') }}

      # Every backend compiles on its own and the default (nothing enabled) still builds.
      - run: cargo build --no-default-features
      - run: cargo build --features slab
      - run: cargo build --features bumpalo
      - run: cargo build --features blink-alloc
      - run: cargo +nightly build --features nightly

      # Full test runs: all stable backends, then the nightly bridge on top.
      - run: just test-features
      - run: just test-nightly

  test:
    uses: ./.github/workflows/miri.yml
